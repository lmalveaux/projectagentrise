<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">Final Expense Agent Career Launchpad</title>
  <desc id="desc">A practical one-page guide to fit, discovery, consent, explanation and follow-up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1dec0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#382418" flood-opacity=".13"/>
    </filter>
    <style>
      .brand{font:700 30px Arial,sans-serif;letter-spacing:5px;fill:#a95732}
      .title{font:800 78px Georgia,serif;fill:#382418}
      .sub{font:400 30px Arial,sans-serif;fill:#6b4b34}
      .num{font:800 40px Arial,sans-serif;fill:#fffaf0}
      .head{font:800 36px Arial,sans-serif;fill:#382418}
      .body{font:400 27px Arial,sans-serif;fill:#6b4b34}
      .foot{font:700 28px Arial,sans-serif;fill:#382418}
      .fine{font:400 21px Arial,sans-serif;fill:#6b4b34}
    </style>
  </defs>
  <rect width="1600" height="2000" fill="url(#bg)"/>
  <circle cx="1450" cy="130" r="260" fill="#d5ad68" opacity=".22"/>
  <circle cx="70" cy="1900" r="300" fill="#66755a" opacity=".12"/>
  <text x="120" y="125" class="brand">AGENT RISE • FRESH POUR</text>
  <text x="120" y="235" class="title">Final Expense</text>
  <text x="120" y="325" class="title">Career Launchpad</text>
  <text x="120" y="385" class="sub">A responsible path from first conversation to clean human handoff</text>

  <g filter="url(#shadow)">
    <rect x="100" y="470" width="1400" height="265" rx="34" fill="#fffdf8"/>
    <circle cx="190" cy="565" r="49" fill="#a95732"/><text x="178" y="579" class="num">1</text>
    <text x="270" y="550" class="head">Confirm the fit before the pitch</text>
    <text x="270" y="605" class="body">• What does the client want protected?</text>
    <text x="270" y="650" class="body">• What coverage already exists?</text>
    <text x="270" y="695" class="body">• Is the premium sustainable—not merely possible today?</text>

    <rect x="100" y="785" width="1400" height="265" rx="34" fill="#fffdf8"/>
    <circle cx="190" cy="880" r="49" fill="#66755a"/><text x="178" y="894" class="num">2</text>
    <text x="270" y="865" class="head">Make the essential terms plain</text>
    <text x="270" y="920" class="body">• Benefit, premium schedule and beneficiary</text>
    <text x="270" y="965" class="body">• Waiting or graded benefit period, when applicable</text>
    <text x="270" y="1010" class="body">• Exclusions, cash value and what happens if payments stop</text>

    <rect x="100" y="1100" width="1400" height="265" rx="34" fill="#fffdf8"/>
    <circle cx="190" cy="1195" r="49" fill="#d5ad68"/><text x="178" y="1209" class="num">3</text>
    <text x="270" y="1180" class="head">Put consent where everyone can see it</text>
    <text x="270" y="1235" class="body">• Confirm the preferred contact method</text>
    <text x="270" y="1280" class="body">• Record permission before future calls, texts or emails</text>
    <text x="270" y="1325" class="body">• Keep sensitive data inside approved agency or carrier systems</text>

    <rect x="100" y="1415" width="1400" height="265" rx="34" fill="#fffdf8"/>
    <circle cx="190" cy="1510" r="49" fill="#382418"/><text x="178" y="1524" class="num">4</text>
    <text x="270" y="1495" class="head">Close the loop every day</text>
    <text x="270" y="1550" class="body">Review leads → contact → document outcome → schedule next step</text>
    <text x="270" y="1595" class="body">Not ready? Place the contact in the correct nurture or resource group.</text>
    <text x="270" y="1640" class="body">Human review remains required before application submission.</text>
  </g>

  <rect x="100" y="1750" width="1400" height="125" rx="28" fill="#382418"/>
  <text x="800" y="1805" text-anchor="middle" class="foot" fill="#fffaf0">BUILD TRUST • KEEP PROMISES • ACHIEVE REFERRALS</text>
  <text x="800" y="1848" text-anchor="middle" class="fine" fill="#f1dec0">Completion check: Can the client explain the purpose, cost, limitations and next step?</text>
  <text x="120" y="1940" class="fine">Use current carrier-approved material and applicable agency, state and federal requirements.</text>
</svg>
