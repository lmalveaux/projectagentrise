<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Rise Pro — Dashboard V2 Mockup</title>
    <link rel="stylesheet" href="../pilot.css">
    <style>
      :root {
        color-scheme: dark;
        --v2-cream: #f5f1ea;
        --v2-gold: #c9a227;
        --v2-ink: #101820;
        --v2-blue: 45, 90, 150;
        --v2-teal: 31, 166, 166;
      }

      * { box-sizing: border-box; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      body.dashboard-v2-shell {
        min-height: 100vh;
        margin: 0;
        padding: clamp(18px, 4vw, 52px);
        overflow-x: hidden;
        color: var(--v2-cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #162636 url("../assets/images/sky-view.jpg") center / cover fixed no-repeat;
      }

      body.dashboard-v2-shell::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(10, 22, 34, .22), rgba(10, 22, 34, .48));
      }

      .dashboard-v2 {
        position: relative;
        z-index: 1;
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .v2-header,
      .jazz-bar,
      .v2-actions {
        border: 1px solid rgba(245, 241, 234, .34);
        background: rgba(19, 36, 52, .48);
        box-shadow: 0 20px 60px rgba(5, 16, 26, .2);
        backdrop-filter: blur(16px) saturate(125%);
        -webkit-backdrop-filter: blur(16px) saturate(125%);
      }

      .v2-header {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 18px;
        min-height: 82px;
        padding: 14px 18px;
        border-radius: 18px 18px 0 0;
      }

      .v2-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .v2-brand img {
        width: 48px;
        height: 48px;
        padding: 3px;
        object-fit: contain;
        border: 1px solid rgba(201, 162, 39, .72);
        border-radius: 12px;
        background: rgba(0, 0, 0, .42);
      }

      .v2-brand-copy { min-width: 0; }
      .v2-brand-copy strong {
        display: block;
        color: var(--v2-cream);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1rem, 2vw, 1.28rem);
        letter-spacing: .02em;
      }
      .v2-brand-copy span {
        display: block;
        margin-top: 3px;
        color: rgba(245, 241, 234, .7);
        font-size: .73rem;
        letter-spacing: .11em;
        text-transform: uppercase;
      }

      .v2-title {
        margin: 0;
        text-align: center;
        color: var(--v2-cream);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.35rem, 3vw, 2rem);
        font-weight: 500;
        letter-spacing: .025em;
      }

      .v2-profile {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        text-align: right;
      }

      .v2-profile-copy strong,
      .v2-profile-copy small { display: block; }
      .v2-profile-copy strong { font-size: .9rem; }
      .v2-profile-copy small { margin-top: 3px; color: rgba(245, 241, 234, .68); }
      .v2-monogram {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(201, 162, 39, .72);
        border-radius: 50%;
        background: rgba(201, 162, 39, .18);
        color: #fffdf6;
        font: 600 1rem Georgia, serif;
      }

      .jazz-bar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 72px;
        padding: 12px 16px;
        border-top: 0;
        background: linear-gradient(90deg, rgba(var(--v2-teal), .3), rgba(var(--v2-blue), .3));
      }

      .jazz-identity {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .jazz-mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid rgba(201, 162, 39, .75);
        border-radius: 50%;
        background: rgba(12, 30, 43, .62);
        color: var(--v2-gold);
        font-size: 1.15rem;
      }

      .jazz-identity strong {
        color: var(--v2-cream);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .jazz-input {
        width: 100%;
        min-height: 46px;
        padding: 0 16px;
        border: 1px solid rgba(245, 241, 234, .45);
        border-radius: 999px;
        outline: none;
        background: rgba(249, 247, 241, .9);
        color: var(--v2-ink);
        font: inherit;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65);
      }

      .jazz-input::placeholder { color: #596570; opacity: 1; }
      .jazz-input:focus {
        border-color: var(--v2-gold);
        box-shadow: 0 0 0 3px rgba(201, 162, 39, .2);
      }

      .jazz-mic {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(245, 241, 234, .48);
        border-radius: 50%;
        background: rgba(11, 40, 57, .72);
        color: var(--v2-cream);
        font-size: 1rem;
        cursor: pointer;
      }

      .v2-actions {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        padding: 16px;
        border-top: 0;
        border-radius: 0 0 18px 18px;
        background: rgba(19, 36, 52, .38);
      }

      .v2-action {
        display: grid;
        min-height: 108px;
        align-content: center;
        gap: 8px;
        padding: 16px 14px;
        border: 1px solid rgba(201, 162, 39, .58);
        border-radius: 12px;
        background: rgba(var(--v2-blue), .44);
        color: var(--v2-cream);
        text-align: left;
        font: inherit;
        cursor: default;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
      }

      .v2-action strong {
        font-size: .98rem;
        letter-spacing: .01em;
      }

      .v2-action span {
        color: rgba(245, 241, 234, .72);
        font-size: .76rem;
        line-height: 1.42;
      }

      .mockup-note {
        margin: 18px 0 0;
        color: rgba(245, 241, 234, .72);
        text-align: center;
        font-size: .78rem;
      }

      @media (max-width: 820px) {
        body.dashboard-v2-shell { padding: 14px; }
        .v2-header { grid-template-columns: 1fr auto; }
        .v2-title { grid-column: 1 / -1; grid-row: 2; padding-top: 4px; }
        .v2-profile-copy { display: none; }
        .jazz-bar { grid-template-columns: auto minmax(0, 1fr) auto; }
        .jazz-identity strong { display: none; }
        .v2-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 470px) {
        .v2-brand-copy span { display: none; }
        .v2-header { padding: 12px; }
        .jazz-bar { gap: 8px; padding: 10px; }
        .jazz-mark { width: 36px; height: 36px; }
        .jazz-mic { width: 44px; height: 44px; }
        .jazz-input { min-height: 44px; padding-inline: 13px; font-size: .9rem; }
        .v2-actions { gap: 9px; padding: 10px; }
        .v2-action { min-height: 102px; padding: 14px 12px; }
        .v2-action:last-child { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body class="dashboard-v2-shell" data-theme="sky-view-day">
    <main class="dashboard-v2" aria-label="Agent Rise Pro dashboard concept">
      <header class="v2-header">
        <div class="v2-brand">
          <img src="../assets/images/arp-logo.png" alt="Agent Rise Pro logo">
          <div class="v2-brand-copy">
            <strong>Agent Rise Pro</strong>
            <span>Medicare agent operating system</span>
          </div>
        </div>
        <h1 class="v2-title">Agent Rise</h1>
        <div class="v2-profile">
          <div class="v2-profile-copy">
            <strong>Good morning, superstar</strong>
            <small>Your day, in focus</small>
          </div>
          <span class="v2-monogram" aria-label="Agent profile">AR</span>
        </div>
      </header>

      <section class="jazz-bar" aria-label="Jazz assistant">
        <div class="jazz-identity">
          <span class="jazz-mark" aria-hidden="true">♪</span>
          <strong>Jazz</strong>
        </div>
        <label>
          <span class="sr-only">Ask or tell Jazz</span>
          <input class="jazz-input" type="text" placeholder="Ask or tell Jazz" aria-label="Ask or tell Jazz">
        </label>
        <button class="jazz-mic" type="button" aria-label="Speak to Jazz">🎙</button>
      </section>

      <nav class="v2-actions" aria-label="Primary dashboard actions">
        <button class="v2-action" type="button"><strong>What to say</strong><span>Say: “Help me prepare for a client call.”</span></button>
        <button class="v2-action" type="button"><strong>My people</strong><span>Say: “Who needs a follow-up today?”</span></button>
        <button class="v2-action" type="button"><strong>Make a call</strong><span>Say: “Call my next client.”</span></button>
        <button class="v2-action" type="button"><strong>Add a lead</strong><span>Say: “Add a new Medicare lead.”</span></button>
        <button class="v2-action" type="button"><strong>Carriers</strong><span>Say: “Show my carrier information.”</span></button>
      </nav>

      <p class="mockup-note">Standalone visual concept — no live dashboard behavior is connected.</p>
    </main>
  </body>
</html>
